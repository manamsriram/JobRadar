# Deploys to the Oracle VM on every push to main: SSH in, pull, rebuild the
# compose stack. .env lives only on the VM (gitignored), never touched here.
#
# script_stop matters more than it looks: without it only the last command's
# exit code counts, so a `git pull` aborting on a dirty working tree still
# reported a green deploy while compose rebuilt the old code. It went unnoticed
# for weeks. Any failing step must fail the job.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/JobRadar
            git pull --ff-only
            docker compose up -d --build
